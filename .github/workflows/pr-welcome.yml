name: Welcome sample-site pull requests

# SECURITY: pull_request_target can comment on pull requests from forks, but this
# workflow must never check out, build, or otherwise execute pull-request content.
# It only explains the flow: private automation replays eligible file changes for
# review, and only the private Aardvark publisher may update public main.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: none
  # This repository's GITHUB_TOKEN authorizes PR-backed issue comments through
  # the pull-request resource; issues: write returned 403 for fork PRs.
  pull-requests: write

jobs:
  welcome:
    if: >-
      github.repository == 'aardvarkdocs/sample-site' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Explain the upstream review flow
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const marker = '<!-- sample-site-sync-welcome -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            if (comments.some((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.startsWith(marker)
            )) {
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: [
                marker,
                '',
                `Thanks @${pr.user.login}!`,
                '',
                'For a new eligible change, this opening event immediately enqueues an exact-PR sync in the private Aardvark source repository. The bot validates and replays eligible file changes into a ready-for-review private pull request; reopening this PR or pushing follow-up commits redispatches that same exact sync. Keep this public pull request open.',
                '',
                'While the private branch still contains the bot-authored mirrored revision, each queued exact sync refreshes it. There is no scheduled scan, public sync workflow, or public secret.',
                '',
                'Once maintainers adopt a conflict resolution, merge the mirror, or the status says the accepted revision is waiting to be published, open a new public pull request for further changes. Later commits are not part of the accepted revision.',
                '',
                'Maintainers review the complete private diff, run isolated CI, resolve any replay conflict there, and merge only the private mirror pull request. You do not need to rebase merely to solve a private-source conflict; isolated CI may wait for the resolved revision.',
                '',
                'This public pull request is never merged into public `main`; that branch accepts only bot-authored outbound sync commits from the Aardvark repository. Merging the private mirror pushes private `main` and triggers the append-only publisher. After its public push, a reconciliation job in that same publisher workflow verifies the accepted private revision is present here, then the bot comments and closes this still-unmerged pull request.',
              ].join('\n'),
            });
